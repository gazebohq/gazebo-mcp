name: Client interoperability report
description: Report a redacted setup or compatibility issue with an MCP client
title: "[Client]: "
labels: ["interoperability"]
body:
  - type: markdown
    attributes:
      value: |
        Never include agent tokens, credentials, authorization headers, or unredacted logs.
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Cursor
        - Claude Code
        - Claude Desktop
        - Windsurf
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Exact client version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Redacted behavior and reproduction steps
      description: Remove all secrets and sensitive output.
    validations:
      required: true
